<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login TemanLansia</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --burgundy: #7A1F2B;
      --cream: #FBF8F5;
      --gold: #C9A227;
      --ink: #1A1A1A;
      --muted: #6B6B6B;
      --line: #E5E1DC;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--cream);
      color: var(--ink);
      font: 14px/1.5 Inter, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 32px);
      box-sizing: border-box;
    }
    .panel {
      width: min(100%, 440px);
      background: #fff;
      border: 1px solid var(--line);
      border-top: 5px solid var(--burgundy);
      border-radius: 20px;
      padding: clamp(20px, 5vw, 32px);
      box-shadow: 0 12px 30px #7a1f2b18;
      box-sizing: border-box;
      margin: auto 0;
    }
    .brand {
      color: var(--burgundy);
      font: 700 clamp(24px, 6vw, 28px) Georgia, serif;
      margin: 0;
      line-height: 1.2;
    }
    .subtitle {
      color: var(--muted);
      margin: 6px 0 20px;
      font-size: clamp(12px, 3.5vw, 13px);
      line-height: 1.45;
    }
    .field {
      display: grid;
      gap: 6px;
      margin: 14px 0;
    }
    .field label {
      font-weight: 700;
      font-size: 13px;
      color: var(--burgundy);
    }
    .field input {
      min-height: 48px;
      width: 100%;
      border: 1px solid #cfc8c2;
      border-radius: 10px;
      padding: 12px;
      font: inherit;
      font-size: 16px;
      box-sizing: border-box;
      background: #fff;
    }
    .field input:focus {
      outline: 3px solid #c9a22766;
      border-color: var(--burgundy);
    }
    button {
      min-height: 48px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: var(--burgundy);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      opacity: .65;
      cursor: wait;
    }
    .error {
      min-height: 20px;
      color: #9f1239;
      font-weight: 600;
      font-size: 13px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      color: var(--burgundy);
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      min-height: 44px;
      padding: 0 12px;
    }
    .back:hover {
      text-decoration: underline;
    }
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .panel {
        padding: 20px 16px;
        border-radius: 16px;
      }
      .field input {
        min-height: 46px;
      }
      button {
        min-height: 46px;
      }
    }
  </style>
</head>
<body>
  <p>Mengalihkan ke Login TemanLansia…</p>
  <script>location.replace('login.html' + location.search + location.hash);</script>
</body>
</html>
