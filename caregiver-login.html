<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login TemanLansia</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root{--burgundy:#7A1F2B;--cream:#FBF8F5;--gold:#C9A227;--ink:#1A1A1A;--muted:#6B6B6B;--line:#E5E1DC}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:20px}
    .panel{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-top:5px solid var(--burgundy);border-radius:14px;padding:30px;box-shadow:0 12px 30px #7a1f2b18}.brand{color:var(--burgundy);font:700 28px Georgia,serif;margin:0}.subtitle{color:var(--muted);margin:4px 0 24px}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:700;color:var(--burgundy)}.field input{min-height:48px;width:100%;border:1px solid #cfc8c2;border-radius:8px;padding:12px;font:inherit}.field input:focus{outline:3px solid #c9a22766;border-color:var(--burgundy)}button{min-height:48px;width:100%;border:0;border-radius:8px;background:var(--burgundy);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{min-height:24px;color:#9f1239;font-weight:600}.demo{margin-top:10px;background:transparent;color:var(--burgundy);border:2px solid var(--gold)}.demo:hover{background:#fff7d6}.back{display:inline-block;margin-top:18px;color:var(--burgundy);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <p>Mengalihkan ke Login TemanLansia…</p>
  <script>location.replace('login.html' + location.search + location.hash);</script>
</body>
</html>
