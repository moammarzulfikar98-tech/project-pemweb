<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login TemanLansia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{burgundy:{950:'#4a1019',900:'#641522',800:'#7a1f2b',700:'#8b1a2d'},cream:{50:'#fffdf9',100:'#fbf8f5',200:'#f5efe8',300:'#e8ded2'},gold:{500:'#c9a227',600:'#a98313'}}}}}</script>
  <style>
    :root {
      --burgundy: #641522;
      --cream: #fbf8f5;
      --gold: #c9a227;
      --line: #e8ded2;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--cream);
      color: #301c20;
      font: 14px/1.5 Inter, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 32px);
      box-sizing: border-box;
    }
    .auth-card {
      width: min(100%, 440px);
      background: #fff;
      border: 1px solid var(--line);
      border-top: 5px solid var(--burgundy);
      border-radius: 20px;
      padding: clamp(20px, 5vw, 32px);
      box-shadow: 0 12px 32px #4a101912;
      box-sizing: border-box;
      margin: auto 0;
    }
    .input-field {
      width: 100%;
      background: #fbf8f5;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font-weight: 600;
      font-size: 16px;
      min-height: 48px;
      box-sizing: border-box;
    }
    .input-field:focus {
      outline: 3px solid #c9a22766;
      border-color: var(--burgundy);
    }
    .btn-primary {
      width: 100%;
      background: var(--burgundy);
      color: #fff;
      border-radius: 10px;
      padding: 13px;
      font-weight: 700;
      font-size: 14px;
      min-height: 48px;
      border: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary:hover {
      background: #7a1f2b;
    }
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .auth-card {
        padding: 20px 16px;
        border-radius: 16px;
      }
      .input-field {
        min-height: 46px;
      }
      .btn-primary {
        min-height: 46px;
      }
    }
  </style>
</head>
<body><p>Mengalihkan ke Login TemanLansia…</p><script>location.replace('login.html' + location.search + location.hash);</script></body>
</html>
