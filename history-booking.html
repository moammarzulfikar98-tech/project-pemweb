<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>History Booking — TemanLansia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{burgundy:{950:'#4a1019',900:'#641522',800:'#7a1f2b',700:'#8b1a2d'},cream:{50:'#fffdf9',100:'#fbf8f5',200:'#f5efe8',300:'#e8ded2'},gold:{500:'#c9a227',600:'#a98313'}}}}}</script>
  <style>
    :root{--burgundy:#641522;--cream:#fbf8f5;--gold:#c9a227;--ink:#301c20;--muted:#76686a;--line:#e8ded2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}.history-card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--burgundy);border-radius:18px;padding:20px;box-shadow:0 8px 24px #4a10190d}.history-card__top,.history-main,.history-meta{display:flex}.history-card__top{justify-content:space-between;gap:12px;align-items:start}.history-card h2{font:700 13px ui-monospace,monospace;overflow-wrap:anywhere;margin:2px 0;color:var(--burgundy)}.history-card h3{font:700 18px Georgia,serif;margin:0;color:var(--burgundy)}.eyebrow{font:700 10px ui-monospace,monospace;letter-spacing:.14em;color:var(--gold);margin:0}.muted{color:var(--muted);margin:3px 0}.history-main{gap:13px;align-items:center;border-bottom:1px solid var(--line);padding:16px 0}.caregiver-photo{width:58px;height:58px;border-radius:14px;object-fit:cover;border:2px solid var(--gold)}.status{font-size:11px;font-weight:800;padding:6px 10px;border-radius:999px;background:#f5efe8;color:var(--burgundy);white-space:nowrap}.status--completed{background:#e6f5ea;color:#17633b}.status--cancelled{background:#fde8e8;color:#9b2424}.status--in_progress{background:#fff4cf;color:#785d00}.history-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.history-meta dt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.history-meta dd{margin:2px 0 0;font-weight:700;font-size:13px}.detail-btn{width:100%;border:1px solid var(--burgundy);border-radius:10px;padding:10px;color:var(--burgundy);font-weight:800;background:#fff;cursor:pointer}.detail-btn:hover{background:#fff6f1}.detail-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:12px;margin-top:18px}.detail-grid b{color:var(--muted);font-size:12px}.detail-grid span{font-weight:700}.modal{position:fixed;inset:0;background:#301c20b8;display:grid;place-items:center;padding:16px;z-index:10}.modal[hidden]{display:none}.modal-card{background:var(--cream);border-radius:18px;padding:24px;max-width:520px;width:100%;position:relative}.close{position:absolute;right:16px;top:10px;border:0;background:none;font-size:25px;cursor:pointer;color:var(--burgundy)}
    @media(max-width:640px){
      main{padding-top:24px;padding-bottom:32px}
      .history-card{padding:16px;border-radius:14px}
      .history-meta{grid-template-columns:1fr;gap:8px}
      .detail-grid{grid-template-columns:1fr;gap:6px}
      .modal-card{padding:20px 16px;max-height:90vh;overflow-y:auto}
    }
  </style>
</head>
<body>
  <header class="sticky top-0 z-10 border-b border-cream-300 bg-cream-50/95 backdrop-blur"><div class="max-w-6xl mx-auto px-5 py-4 flex justify-between items-center"><a href="index.html" class="font-serif text-2xl font-bold text-burgundy-950">TemanLansia</a><a href="index.html" class="text-xs font-bold text-burgundy-900">Kembali ke Beranda</a></div></header>
  <main class="max-w-6xl mx-auto px-5 py-12"><div class="flex flex-col sm:flex-row sm:items-end justify-between gap-5 mb-8"><div><p class="eyebrow">CUSTOMER AREA</p><h1 class="font-serif text-4xl font-bold text-burgundy-950 mt-1">History Booking</h1><p class="text-stone-600 mt-2">Riwayat pesanan dari akun yang sedang login.</p></div><label class="text-xs font-bold text-burgundy-950">Filter status<select id="statusFilter" class="block mt-2 border border-cream-300 rounded-lg bg-white px-3 py-2 font-normal"><option value="all">Semua status</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="in_progress">In Progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label></div>
    <p id="historyLoading" class="text-stone-600">Memuat history booking...</p><div id="historyError" class="hidden rounded-xl border border-red-200 bg-red-50 text-red-800 p-4" role="alert"></div><div id="historyEmpty" class="hidden rounded-2xl border border-cream-300 bg-white p-10 text-center"><h2 class="font-serif text-2xl font-bold text-burgundy-950">Belum ada booking</h2><p class="text-stone-600 mt-2">Booking milik akun ini akan tampil di sini.</p></div><section id="historyList" class="grid gap-5 md:grid-cols-2" aria-live="polite"></section>
  </main>
  <div id="detailModal" class="modal" hidden><div class="modal-card"><button id="closeDetail" class="close" aria-label="Tutup detail">×</button><div id="detailBody"></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.local.js"></script><script src="js/caregivers-data.js"></script><script src="js/supabase-client.js"></script><script src="js/history-booking.js"></script>
</body>
</html>
