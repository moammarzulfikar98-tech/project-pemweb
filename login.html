<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login TemanLansia</title>
  <link rel="stylesheet" href="css/style.css">
  <style>:root{--burgundy:#641522;--cream:#fbf8f5;--gold:#c9a227;--line:#e8ded2}body{margin:0;min-height:100vh;background:var(--cream);color:#301c20;font:14px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-top:5px solid var(--burgundy);border-radius:20px;padding:32px;box-shadow:0 12px 32px #4a101912}.brand{margin:0;color:var(--burgundy);font:700 30px Georgia,serif}.sub{color:#6b6b6b;margin:4px 0 24px}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:700;color:var(--burgundy)}.field input{width:100%;min-height:48px;box-sizing:border-box;border:1px solid #cfc8c2;border-radius:10px;padding:12px;font:inherit}.field input:focus{outline:3px solid #c9a22766;border-color:var(--burgundy)}button{width:100%;min-height:48px;border:0;border-radius:10px;background:var(--burgundy);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.alert{min-height:24px;color:#991b1b;font-weight:600}.links{border-top:1px solid var(--line);margin-top:22px;padding-top:18px;text-align:center}.links a{color:var(--burgundy);font-weight:700}.back{display:block;margin-top:20px;text-align:center;color:var(--burgundy);font-weight:700}
@media(max-width:480px){
  body{padding:12px}
  .card{padding:22px 16px;border-radius:16px}
  .brand{font-size:24px}
  .sub{font-size:12px;margin:4px 0 16px}
  .field{margin:12px 0}
  .field input{min-height:44px;padding:10px}
  button{min-height:44px}
}
</style>
</head>
<body>
  <main class="card">
    <p style="color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.12em;margin:0">AKSES TERPUSAT</p>
    <h1 class="brand">Login TemanLansia</h1><p class="sub">Masuk dengan email dan password. Sistem menentukan akses dari role akun.</p>
    <div id="alert" class="alert" role="alert" aria-live="polite"></div>
    <form id="form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button id="submit" type="submit">Masuk ke Akun</button>
    </form>
    <div class="links"><a href="#" id="forgot">Lupa Password?</a><p>Belum punya akun? <a href="customer-register.html">Daftar Sekarang</a></p></div>
    <a class="back" href="index.html">← Kembali ke katalog</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.local.js"></script><script src="js/supabase-client.js"></script>
  <script>
    (() => {
      const form=document.getElementById('form'), button=document.getElementById('submit'), alertBox=document.getElementById('alert');
      const returnUrl=new URLSearchParams(location.search).get('returnUrl');
      const show=message=>{alertBox.textContent=message;};
      document.getElementById('forgot').addEventListener('click',event=>{event.preventDefault();show('Fitur reset password belum diaktifkan pada project ini.');});
      form.addEventListener('submit',async event=>{event.preventDefault();show('');button.disabled=true;button.textContent='Memeriksa…';try{const result=await window.TemanLansiaSupabase.signInUniversal(document.getElementById('email').value,document.getElementById('password').value);const target=result.role==='admin'?'admin.html':result.role==='caregiver'?'caregiver.html':window.TemanLansiaSupabase.safeInternalReturnUrl(returnUrl);location.replace(target);}catch(error){show(error.message||'Login gagal.');button.disabled=false;button.textContent='Masuk ke Akun';}});
    })();
  </script>
</body>
</html>
