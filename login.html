<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login TemanLansia</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --burgundy: #641522;
      --cream: #fbf8f5;
      --gold: #c9a227;
      --line: #e8ded2;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--cream);
      color: #301c20;
      font: 14px/1.5 Inter, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 32px);
      box-sizing: border-box;
    }
    .card {
      width: min(100%, 440px);
      background: #fff;
      border: 1px solid var(--line);
      border-top: 5px solid var(--burgundy);
      border-radius: 20px;
      padding: clamp(20px, 5vw, 32px);
      box-shadow: 0 12px 32px #4a101912;
      box-sizing: border-box;
      margin: auto 0;
    }
    .brand {
      margin: 0;
      color: var(--burgundy);
      font: 700 clamp(24px, 6vw, 30px) Georgia, serif;
      line-height: 1.2;
    }
    .sub {
      color: #6b6b6b;
      margin: 6px 0 20px;
      font-size: clamp(12px, 3.5vw, 13px);
      line-height: 1.45;
    }
    .field {
      display: grid;
      gap: 6px;
      margin: 14px 0;
    }
    .field label {
      font-weight: 700;
      font-size: 13px;
      color: var(--burgundy);
    }
    .input-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .field input {
      width: 100%;
      min-height: 48px;
      box-sizing: border-box;
      border: 1px solid #cfc8c2;
      border-radius: 10px;
      padding: 12px;
      font: inherit;
      font-size: 16px;
      background: #fff;
      color: inherit;
    }
    .input-wrapper input {
      padding-right: 44px;
    }
    .toggle-pwd {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 8px;
      cursor: pointer;
      color: #76686a;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      min-height: 36px;
      min-width: 36px;
    }
    .toggle-pwd:hover {
      color: var(--burgundy);
    }
    .toggle-pwd svg {
      width: 18px;
      height: 18px;
    }
    .field input:focus {
      outline: 3px solid #c9a22766;
      border-color: var(--burgundy);
    }
    button.btn-submit {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      background: var(--burgundy);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }
    button.btn-submit:hover {
      background: #7a1f2b;
    }
    button.btn-submit:disabled {
      opacity: .65;
      cursor: wait;
    }
    .alert {
      min-height: 20px;
      color: #991b1b;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .links {
      border-top: 1px solid var(--line);
      margin-top: 20px;
      padding-top: 16px;
      text-align: center;
      font-size: 13px;
    }
    .links p {
      margin: 8px 0 0;
    }
    .links a {
      color: var(--burgundy);
      font-weight: 700;
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      color: var(--burgundy);
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      min-height: 44px;
      padding: 0 12px;
    }
    .back:hover {
      text-decoration: underline;
    }
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .card {
        padding: 20px 16px;
        border-radius: 16px;
      }
      .field input {
        min-height: 46px;
      }
      button.btn-submit {
        min-height: 46px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <p style="color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.12em;margin:0 0 2px">AKSES TERPUSAT</p>
    <h1 class="brand">Login TemanLansia</h1>
    <p class="sub">Masuk dengan email dan password. Sistem menentukan akses dari role akun.</p>
    <div id="alert" class="alert" role="alert" aria-live="polite"></div>
    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="nama@email.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" id="togglePasswordBtn" class="toggle-pwd" aria-label="Tampilkan atau sembunyikan password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <button id="submit" type="submit" class="btn-submit">Masuk ke Akun</button>
    </form>
    <div class="links">
      <a href="#" id="forgot">Lupa Password?</a>
      <p>Belum punya akun? <a href="customer-register.html">Daftar Sekarang</a></p>
    </div>
    <div style="text-align:center">
      <a class="back" href="index.html">← Kembali ke katalog</a>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.local.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    (() => {
      const form = document.getElementById('form');
      const button = document.getElementById('submit');
      const alertBox = document.getElementById('alert');
      const returnUrl = new URLSearchParams(location.search).get('returnUrl');
      const show = message => { alertBox.textContent = message; };

      // Password visibility toggle
      const pwdInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const eyeIcon = document.getElementById('eyeIcon');
      if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', () => {
          const isText = pwdInput.type === 'text';
          pwdInput.type = isText ? 'password' : 'text';
          if (eyeIcon) {
            eyeIcon.innerHTML = isText 
              ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>'
              : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
          }
        });
      }

      document.getElementById('forgot').addEventListener('click', event => {
        event.preventDefault();
        show('Fitur reset password belum diaktifkan pada project ini.');
      });

      form.addEventListener('submit', async event => {
        event.preventDefault();
        show('');
        button.disabled = true;
        button.textContent = 'Memeriksa…';
        try {
          const result = await window.TemanLansiaSupabase.signInUniversal(
            document.getElementById('email').value,
            document.getElementById('password').value
          );
          const target = result.role === 'admin' 
            ? 'admin.html' 
            : result.role === 'caregiver' 
              ? 'caregiver.html' 
              : window.TemanLansiaSupabase.safeInternalReturnUrl(returnUrl);
          location.replace(target);
        } catch (error) {
          show(error.message || 'Login gagal.');
          button.disabled = false;
          button.textContent = 'Masuk ke Akun';
        }
      });
    })();
  </script>
</body>
</html>
